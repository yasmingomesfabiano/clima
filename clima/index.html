<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climax</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/bowling" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/caitiff" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/jana" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/noto-serif-ottoman-siyaq" rel="stylesheet">
                
                                                
</head>
<body>

    <div class="container">
      <h1>Clima agora</h1>
      <input type="text" id="cidade" class="cidade" placeholder="Digite a cidade">
      <button onclick="buscarClima()" class="button">Buscar</button>
    
      <div id="resultado" class="resultado">
        <h2 id="nomeCidade"></h2>
        <p id="temperatura" class="temperatura"></p>
        <p id="umidade" class="umidade"></p>
        <p id="descricao" class="descricao"></p>
      </div>
    
      <h3 id="titulo-previsao">Previsão para os próximos dias:</h3>
      <div id="previsao"></div>

    </div>
    


<script src="script.js"></script>
</body>
</html>
